name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: >-
          Semver level to bump the latest tag by. `patch` suits a routine release; pick `minor` when
          the release changes behaviour consumers can observe.
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# No dry-run input, deliberately. check-and-register.yml fires whenever this workflow completes
# successfully, and a dry run does - releasing nothing. Registration then cannot find the release
# it should record and falls back to the most recently created one, re-registering a version that
# already shipped. The input belongs here once registration moves inside the release workflow,
# where it is gated on dry-run.
jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.3
    with:
      java-version: '8'
      flow-type: public
      increment-version-level: ${{ inputs.increment-version-level }}
    secrets: inherit
