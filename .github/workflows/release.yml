name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: >-
          Semver level to bump the latest tag by. `patch` suits a routine release; pick `minor` when
          the release changes behaviour consumers can observe.
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# No dry-run input, deliberately. check-and-register.yml fires on this workflow completing
# successfully, and a dry run completes successfully while releasing nothing - the version
# resolver then finds no release carrying the run's stamp and falls back to the most recently
# created release, re-registering a version that was already released. Observed live on
# octopus-parent: a dry run registered 2.2.0 a second time. Tracked in octopusden/octopus-base#236;
# the input can come back once registration skips dry runs.
jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.3
    with:
      java-version: '8'
      flow-type: public
      increment-version-level: ${{ inputs.increment-version-level }}
    secrets: inherit
